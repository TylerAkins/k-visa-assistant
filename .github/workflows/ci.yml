name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_ENV: dev
  NODE_ENV: production
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://kvisaassistant:kvisaassistant@127.0.0.1:5432/kvisaassistant
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters-long
  EMAIL_PROVIDER: console

jobs:
  baseline:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage
        run: pnpm test:coverage
